<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carga ctnapi</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --tx:#1d232b; --mute:#5d6875; --bd:#d9dee4; --ac:#1f5fae; --ok:#1e7b44; --err:#b3261e; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --panel:#1d2127; --tx:#e6e9ed; --mute:#9aa5b1; --bd:#333a43; --ac:#6ea8ff; --ok:#5cc58a; --err:#ff8a80; --warn:#f0b54a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--tx); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--bd); }
  header h1 { font-size:16px; margin:0; }
  #destino { padding:2px 8px; border-radius:4px; font-weight:600; border:1px solid currentColor; }
  #estado { color:var(--mute); }
  nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px 0; }
  nav button { border:1px solid var(--bd); border-bottom:none; background:transparent; color:var(--tx); padding:6px 12px; border-radius:6px 6px 0 0; cursor:pointer; }
  nav button.on { background:var(--panel); font-weight:600; }
  main { margin:0 16px 16px; background:var(--panel); border:1px solid var(--bd); border-radius:0 6px 6px 6px; padding:16px; }
  .barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  input, select { font:inherit; padding:5px 8px; border:1px solid var(--bd); border-radius:4px; background:var(--bg); color:var(--tx); }
  button.b { font:inherit; padding:5px 12px; border-radius:4px; border:1px solid var(--ac); background:var(--ac); color:#fff; cursor:pointer; }
  button.s { font:inherit; padding:3px 8px; border-radius:4px; border:1px solid var(--bd); background:transparent; color:var(--tx); cursor:pointer; }
  button.s.del { color:var(--err); }
  .tabla { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--bd); white-space:nowrap; }
  th { color:var(--mute); font-weight:600; }
  form.f { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; padding:12px; margin-bottom:12px; border:1px solid var(--bd); border-radius:6px; }
  form.f label { display:flex; flex-direction:column; gap:3px; color:var(--mute); font-size:12px; }
  form.f .acc { grid-column:1/-1; display:flex; gap:8px; }
  .multi { display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--tx); font-size:13px; }
  #msg { margin:8px 16px 0; min-height:1.4em; }
  #msg.ok { color:var(--ok); } #msg.err { color:var(--err); }
  .aviso { color:var(--warn); }
  .err { color:var(--err); }
  details { margin:8px 0; }
  .mute { color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>Carga de datos · ctnapi</h1>
  <span id="destino">…</span>
  <span id="estado"></span>
</header>
<div id="msg"></div>
<nav id="tabs"></nav>
<main id="vista"></main>
<script src="app.js"></script>
</body>
</html>
