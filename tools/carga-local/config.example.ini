; Copiar a config.ini (no se sube al repo) y completar.
[ctnapi]
; Nombre que se muestra arriba en la página, para no confundir prueba con producción.
nombre = PRUEBA
; Dirección de ctnapi. Red interna: http://192.168.100.102:8080
; Por túnel SSH: http://127.0.0.1:18080  (ssh -L 18080:192.168.100.102:8080 ...)
url = http://192.168.100.102:8080
; CORE_API_KEY de /etc/ctnapi/ctnapi.env
clave = CAMBIAR
puerto = 8765
verificar_tls = true
