# /etc/nginx/sites-available/ctnapi   — reemplazar el server_name y los certificados (certbot --nginx).
server {
    listen 80;
    server_name ctnapi.EJEMPLO.duckdns.org;

    # La foto de anotaciones llega hasta 5 MB (+ formulario).
    client_max_body_size 6m;

    # La API del núcleo es solo para servicios internos. Reemplazar por la IP privada de SCA.
    location ^~ /api/core/ {
        client_max_body_size 1m;
        allow 192.168.100.SCA;
        deny all;
        proxy_pass http://192.168.100.CTNAPI:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://192.168.100.CTNAPI:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
